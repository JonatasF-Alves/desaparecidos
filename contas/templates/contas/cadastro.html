{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<h1>Criar conta</h1>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn alt">Criar conta</button>
</form>
<p class="aviso">Já tem conta? <a href="{% url 'contas:login' %}">Entrar</a></p>
{% endblock %}
