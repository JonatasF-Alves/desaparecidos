<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Pessoas desaparecidas{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#172b3a;--ink-soft:#294354;--paper:#f3f6f5;--card:#fff;--alert:#e7ad47;--ok:#237b63;--muted:#687982;--line:#dce5e2;--shadow:0 16px 40px rgba(23,43,58,.08)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Source Serif 4",Georgia,serif;color:var(--ink);background:var(--paper)}
h1,h2,h3,.brand,.btn,label,.nav a,.badge,.eyebrow,.section-title{font-family:"DM Sans","Helvetica Neue",Arial,sans-serif}
.wrap{width:min(1160px,100%);margin:0 auto;padding:0 24px}
header{background:var(--ink);box-shadow:0 4px 18px rgba(23,43,58,.12)}
header .wrap{display:flex;min-height:78px;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.brand{display:inline-flex;align-items:center;gap:11px;color:#fff;font-weight:800;font-size:1.12rem;letter-spacing:-.03em;text-decoration:none}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--alert);color:var(--ink)}
.brand-mark svg{width:22px;height:22px}
.nav{display:flex;gap:26px;align-items:center}
.nav a:not(.btn){color:#e3eceb;text-decoration:none;font:600 .94rem "DM Sans",Arial,sans-serif;transition:color .2s}
.nav a:not(.btn):hover{color:#fff}
.nav-user{color:#e3eceb;font:600 .94rem "DM Sans",Arial,sans-serif}
main{min-height:calc(100vh - 78px);padding:36px 0 72px}
h1{font-size:clamp(2rem,4vw,3.15rem);line-height:1.08;letter-spacing:-.045em;margin:0 0 18px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;text-decoration:none;border:0;font:700 .94rem "DM Sans",Arial,sans-serif;cursor:pointer;transition:transform .18s,background .18s,box-shadow .18s}
.btn:hover{background:var(--ink-soft);box-shadow:0 6px 16px rgba(23,43,58,.16);transform:translateY(-1px)}
.btn.alt{background:var(--alert);color:var(--ink)}
.btn.alt:hover{background:#f0bd62}
.btn.ok{background:var(--ok)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--alert);outline-offset:3px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
input::placeholder{color:#89969b}
.busca{display:flex;gap:10px;margin-bottom:30px}
.busca input{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:var(--card);border:1px solid rgba(220,229,226,.9);border-radius:15px;overflow:hidden;position:relative;box-shadow:0 4px 16px rgba(23,43,58,.035);transition:transform .2s,box-shadow .2s}
.card:hover,.card:focus-within{transform:translateY(-4px);box-shadow:var(--shadow)}
.card img,.foto-vazia{width:100%;aspect-ratio:4/4.4;object-fit:cover;display:grid;background:#e9efec}
.foto-vazia{place-items:center;color:#73857f;font:600 .9rem "DM Sans",Arial,sans-serif}
.card .info{padding:16px 17px 18px}
.card h3{margin:1px 0 5px;font-size:1.15rem;line-height:1.3;letter-spacing:-.02em}
.card p{margin:3px 0 0;color:var(--muted);font-size:.91rem}
.card a.cobre{position:absolute;inset:0;border-radius:inherit}
.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:.72rem;letter-spacing:.02em;font-weight:700;background:#fff0d5;color:#82540d;margin-bottom:7px}
.badge.ok{background:#e3f3ed;color:#216b56}
.msg{background:#e6f2ec;border:1px solid #cde5d8;border-left:5px solid var(--ok);border-radius:8px;padding:12px 16px;margin-bottom:20px}
.vazio{color:var(--muted)}
.detalhe{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;align-items:start}
.detalhe img{width:100%;border-radius:15px;display:block;box-shadow:var(--shadow)}
.faixa{background:#fff0d5;color:#82540d;font:700 .85rem "DM Sans",Arial,sans-serif;border-radius:999px;padding:8px 13px;display:inline-block;margin-bottom:14px}
.faixa.ok{background:#e3f3ed;color:#216b56}
.dados{margin:18px 0;padding:0;list-style:none}
.dados li{padding:10px 0;border-bottom:1px solid var(--line)}
.dados b{font-family:"DM Sans",Arial,sans-serif}
.aviso{color:var(--muted);font-size:.95rem}
.form{max-width:680px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:25px;box-shadow:0 8px 28px rgba(23,43,58,.045)}
.form p{margin:0 0 16px}
.form label{display:block;font-weight:700;margin-bottom:5px}
.helptext,.errorlist{font-size:.9rem;color:var(--muted)}
.errorlist{color:#b42318;list-style:none;padding:0;margin:0 0 4px}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}
.numeros div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:0 4px 16px rgba(23,43,58,.035)}
.numeros strong{display:block;font:800 2rem "DM Sans",Arial,sans-serif;color:var(--ok)}
.paginas{margin-top:28px;display:flex;justify-content:center;gap:10px}
.eyebrow{display:block;margin-bottom:12px;color:var(--ok);font-size:.77rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.section-title{font-weight:700;color:var(--ink-soft)}
.hero{position:relative;isolation:isolate;overflow:hidden;margin:0 0 40px;padding:clamp(30px,6vw,62px);border-radius:22px;background:linear-gradient(120deg,#172b3a 0%,#244b54 100%);color:#fff;box-shadow:var(--shadow)}
.hero:after{position:absolute;z-index:-1;content:"";width:340px;height:340px;right:-90px;top:-165px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 32px rgba(255,255,255,.035),0 0 0 68px rgba(255,255,255,.025)}
.hero .eyebrow{color:#f0c777}
.hero h1{max-width:720px;margin-bottom:14px}
.hero-text{max-width:600px;margin:0 0 26px;color:#d7e3e0;font-size:1.05rem}
.hero .busca{position:relative;z-index:1;align-items:center;max-width:740px;margin:0;padding:7px;background:#fff;border:1px solid rgba(255,255,255,.25);border-radius:12px;box-shadow:0 12px 30px rgba(8,22,31,.18)}
.campo-busca{display:flex;align-items:center;gap:10px;flex:1;padding-left:10px}
.campo-busca svg{width:21px;height:21px;flex:none;color:#74847f}
.hero .busca input{border:0;outline:0;padding:10px 4px;box-shadow:none}
.hero .busca .btn{min-height:46px}
.limpar-busca{padding:8px 10px;color:var(--muted);font:600 .84rem "DM Sans",Arial,sans-serif;text-decoration:none;white-space:nowrap}
.limpar-busca:hover{color:var(--ink);text-decoration:underline}
.lista-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:17px}
.lista-heading .eyebrow{margin-bottom:4px}
.lista-heading h2{margin:0;font-size:1.35rem;letter-spacing:-.025em}
.lista-nota{color:var(--muted);font-size:.9rem}
.vazio-card{grid-column:1/-1;padding:35px;background:#fff;border:1px dashed #c9d7d1;border-radius:14px;text-align:center}
.vazio-card strong{font:700 1.1rem "DM Sans",Arial,sans-serif}
.vazio-card p{margin:5px 0 18px}
.pagina-atual{display:flex;align-items:center;padding:0 8px;color:var(--muted);font:600 .9rem "DM Sans",Arial,sans-serif}
.btn-light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-light:hover{background:#edf2f0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:720px){.wrap{padding-right:18px;padding-left:18px}header .wrap{min-height:70px}.nav{gap:14px}main{padding:26px 0 52px}.detalhe{grid-template-columns:1fr;gap:24px}.detalhe img{max-height:560px;object-fit:cover}h1{font-size:2.1rem}}
@media(max-width:480px){header .wrap{justify-content:center}.brand{margin-right:auto}.nav{width:100%;justify-content:space-between}.busca{flex-direction:column}.busca .btn{width:100%}.hero{margin-bottom:30px;border-radius:16px}.hero .busca{align-items:stretch;padding:8px}.hero .busca .btn{width:100%}.hero .limpar-busca{text-align:center}.lista-heading{align-items:start;flex-direction:column;gap:4px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border-radius:12px}.card .info{padding:12px}.card h3{font-size:1rem}.card p{font-size:.82rem}.badge{font-size:.65rem}.form{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="{% url 'casos:lista' %}">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s7-4.35 7-11a7 7 0 1 0-14 0c0 6.65 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg></span>
    Pessoas desaparecidas
  </a>
    <nav class="nav">
    <a href="{% url 'analises:painel' %}">Estatísticas</a>
    {% if user.is_authenticated %}
      <a href="{% url 'casos:meus_casos' %}">Meus casos</a>
      <span class="nav-user">Olá, {{ user.username }}</span>
      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button class="btn btn-light">Sair</button>
      </form>
    {% else %}
    <a href="{% url 'account_login' %}">Entrar</a>
    <a href="{% url 'account_signup' %}">Criar conta</a>
    {% endif %}
    <a class="btn alt" href="{% url 'casos:cadastrar' %}">Cadastrar caso</a>
  </nav>
</div></header>
<main><div class="wrap">
  {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
  {% block conteudo %}{% endblock %}
</div></main>
</body>
</html>
